<!DOCTYPE html>
<html>
<head>
    <title>Event Registration</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
        }
        form {
            width: 350px;
            margin: 30px auto;
        }
        input,
        select,
        button {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
        }
        #details {
            width: 350px;
            margin: 20px auto;
            padding: 15px;
            border: 2px solid black;
            text-align: left;
            display: none;
        }
    </style>
</head>
<body>
    <h2>Event Registration Form</h2>
    <form onsubmit="registerUser(event)">
        <label>Name</label>
        <input type="text" id="name" required>
        <label>Phone Number</label>
        <input type="text" id="phone" required>
        <label>Email</label>
        <input type="email" id="email" required>
        <label>Select Event</label>
        <select id="event">
            <option>Technical Quiz</option>
            <option>Hackathon</option>
            <option>Paper Presentation</option>
            <option>Coding Contest</option>
            <option>Workshop</option>
        </select>
        <label>Date of Event</label>
        <input type="date" id="date" required>
        <button type="submit">Register</button>
    </form>
    <!-- Registration details will appear here -->
    <div id="details">
        <h3>Registration Successful!</h3>
        <p>
            <b>Name:</b>
            <span id="showName"></span>
        </p>
        <p>
            <b>Phone:</b>
            <span id="showPhone"></span>
        </p>
        <p>
            <b>Email:</b>
            <span id="showEmail"></span>
        </p>
        <p>
            <b>Event:</b>
            <span id="showEvent"></span>
        </p>
        <p>
            <b>Date:</b>
            <span id="showDate"></span>
        </p>
    </div>
    <script>
        function registerUser(event) {
            event.preventDefault();
            // Get values from the form
            let name = document.getElementById("name").value;
            let phone = document.getElementById("phone").value;
            let email = document.getElementById("email").value;
            let eventName = document.getElementById("event").value;
            let date = document.getElementById("date").value;
            // Display values
            document.getElementById("showName").innerText = name;
            document.getElementById("showPhone").innerText = phone;
            document.getElementById("showEmail").innerText = email;
            document.getElementById("showEvent").innerText = eventName;
            document.getElementById("showDate").innerText = date;
            // Show registration details
            document.getElementById("details").style.display = "block";
        }
    </script>
</body>
</html>
