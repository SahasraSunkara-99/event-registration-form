<!DOCTYPE html>
<html>
    <head>
        <title>Registration Form</title>
        <style>
            body{
                font-family: Arial;
                text-align: center;
            }
            form{
                width: 350px;
                margin: 30px auto;
            }
            input,select,button{
                width: 100%;
                padding: 8px;
                margin: 8px 0;
            }
            #details{
                width: 350px;
                margin: 20px auto;
                padding: 15px;
                border: 2px solid black;
                text-align: left;
                display: none;
            }
        </style>
    </head>
    <body>
        <h2>Event Registration Form</h2>
        <form onsubmit="registerUser(event)">
        <label>Name</label>
        <input type="text" id="name" required>
        <label>Phone Number</label>
        <input type="text" id="phone" required>
        <label>E-mail</label>
        <input type="email" id="email" required>
        <label>Select an Event</label>
        <select id="event" required>
            <option value="">Select an Event</option>
            <option>Hackathon</option>
            <option>Singing</option>
            <option>Dance</option>
            <option>Photography</option>
            <option>Drawing</option>
        </select>
        <label>Choose the Date</label>
        <input type="date" id="date" required>
        <button type="submit">Register</button>
    </form>
        <div id="details">
            <h3>Registration Successful!</h3>
            <p>
                <b>Name:</b>
                <span id="showName"></span>
            </p>
            <p>
                <b>Phone Number:</b>
                <span id="showPhone"></span>
            </p>
            <p>
                <b>email</b>
                <span id="showEmail"></span>
            </p>
            <p>
                <b>Event Selected:</b>
                <span id="showEvent"></span>
            </p>
            <p>
                <b>Date:</b>
                <span id="showDate"></span>
            </p>
        </div>
        <script>
            function registerUser(event){
                event.preventDefault();
                let name = document.getElementById("name").value;
                let phone = document.getElementById("phone").value;
                let email = document.getElementById("email").value;
                let eventName = document.getElementById("event").value;
                let date = document.getElementById("date").value;
                document.getElementById("showName").innerText = name;
                document.getElementById("showPhone").innerText = phone;
                document.getElementById("showEmail").innerText = email;
                document.getElementById("showEvent").innerText = eventName;
                document.getElementById("showDate").innerText = date;
                document.getElementById("details").style.display = "block";
            }
        </script>
    </body>
</html>
